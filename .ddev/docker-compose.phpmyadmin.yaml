#ddev-generated
services:
  phpmyadmin:
    container_name: ddev-${DDEV_SITENAME}-phpmyadmin
    image: phpmyadmin:5.2.2@sha256:8f3cff677b17f2e5e82586be70164d8439cf82e1b52b6280ea13c875de45f62b
    working_dir: "/root"
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
    - ".:/mnt/ddev_config"
    - "ddev-global-cache:/mnt/ddev-global-cache"
    expose:
      - "80"
    environment:
    - PMA_USER=root
    - PMA_PASSWORD=root
    - PMA_HOST=db
    - PMA_PORT=3306
    - VIRTUAL_HOST=$DDEV_HOSTNAME
    - UPLOAD_LIMIT=4000M
    - HTTP_EXPOSE=8036:80
    - HTTPS_EXPOSE=8037:80
    healthcheck:
      interval: 120s
      timeout: 2s
      retries: 1
    depends_on:
      - db
