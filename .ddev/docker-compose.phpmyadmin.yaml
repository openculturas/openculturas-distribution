#ddev-generated
services:
  phpmyadmin:
    container_name: ddev-${DDEV_SITENAME}-phpmyadmin
    image: phpmyadmin:5.2.2@sha256:24396f4d51b0b3af74ed78584ddb48be9432f204b31e79b9d24d6a45b2a1719b
    working_dir: "/root"
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
    - ".:/mnt/ddev_config"
    - "ddev-global-cache:/mnt/ddev-global-cache"
    expose:
      - "80"
    environment:
    - PMA_USER=root
    - PMA_PASSWORD=root
    - PMA_HOST=db
    - PMA_PORT=3306
    - VIRTUAL_HOST=$DDEV_HOSTNAME
    - UPLOAD_LIMIT=4000M
    - HTTP_EXPOSE=8036:80
    - HTTPS_EXPOSE=8037:80
    healthcheck:
      interval: 120s
      timeout: 2s
      retries: 1
    depends_on:
      - db
