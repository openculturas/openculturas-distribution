description:
  de:
    genericName: Veranstaltungs- und Kulturplattform
    documentation: 'https://www.openculturas.org/de/handbuch'
    awards:
      - Splash Awards
    shortDescription: 'Veranstaltungskalender und Kulturplattform mit Profilen, Magazin, interaktiven Karten'
    longDescription: >
      ## Veranstaltungskalender und Kulturplattform mit Profilen, Magazin, interaktiven Karten


      Webbasiertes Content-Management-System, für nutzergenerierte und/oder rein
      redaktionelle Inhalte wie z.B.: Personen-/Gruppenprofile,
      Veranstaltungsorte, touristische Attraktionen, wiederverwendbare
      Veranstaltungsbeschreibungen Termine (Wiederholungstermine möglich), FAQ,
      Magazinartikel.


      Tagging in vielen Dimensionen: gemeinsame Fokus-Verschlagwortung,
      Kategorisierung nach Typ, Magazinrubriken, Barrierefreiheit,
      Triggerwarnungen usw. Komponenten zur Inhaltserstellung wie
      wiederverwendbare Medien (Bilder, Video, Audio, einbettbare Remote-Medien,
      herunterladbare Dokumente), Galerien, Pressezitate, benutzerdefinierte
      Teaser-Abschnitte, automatische Platzierung von Teasern für verknüpfte
      Inhalte.


      Mehrsprachig und suchmaschinenoptimiert, mit Freigabeprozessen,
      BITV-konform, Cookie-Zustimmungsmanagement. Eingeloggte Nutzer\*innen
      können persönliche Lesezeichen verwalten, Empfehlungen veröffentlichen und
      Inhalte kommentieren.


      Governance: Betreiber:innen und bewährte Agenturen entscheiden im Rahmen
      des OpenCulturas e. V. gemeinsam über die Weiterentwicklung, offen für
      Interessierte. Budgets für neue Features und nachhaltige Wartung
      willkommen. Komplett-Dienstleistungen inklusive Hosting und individuellem
      Design oder als SaaS (Software als Service)  können vermittelt werden.


      Mehr über den Leistungsumfang auf
      [openculturas.org](https://www.openculturas.org)
    features:
      - Veranstaltungskalender
      - Kultur-Datenbank
      - Profile
      - Interaktive Karten
      - Barrierefreiheit
    screenshots:
      - screenshots/OpenCulturas_Mood4.png
      - screenshots/OpenCulturas_Interaktive-Karten.png
      - screenshots/OpenCulturas_Intuitive-Bedienung.png
  en:
    genericName: Event and culture platform
    documentation: 'https://www.openculturas.org/en/manual'
    awards:
      - Splash Awards
    shortDescription: 'Cultural event platform with event calendar, profiles, magazine'
    longDescription: >
      ## Cultural event platform with event calendar, profiles, magazine


      Web-based content management platform software, ready for editorial and/or
      user-generated content such as: personal/group profiles, event locations,
      points of interest, reusable event descriptions, event dates (repeating
      dates possible), FAQ, magazine articles.


      Tagging in many dimensions: common focus tags, per-type categorization,
      magazine columns, accessibility, trigger warnings etc. Content creation
      components like reusable media assets (images, video, audio, embeddable
      remote media, downloadable documents), galleries, press quotes, custom
      teaser sections, automatic teaser placement for interlinked content.


      Multilingual, with publication workflows, WCAG compliant, cookie consent
      management, search engine optimized. Logged in users can manage personal
      bookmarks, publish recommendations and write comments to commentable
      content.


      Governance: Site owners and proven agencies decide jointly on further
      development as members of OpenCulturas e. V. (non-profit association),
      open for everyone interested! Budgets for new features and sustainable
      mainenance are welcome. Full-service offers including hosting and
      individual design or SaaS (software as a service) can be arranged.


      Read more about features on 
      [openculturas.org](https://www.openculturas.org)
    features:
      - Event calendar
      - Arts + culture database
      - Profiles
      - Interactive maps
      - Accessibility
    screenshots:
      - screenshots/OpenCulturas_Mood4.png
      - screenshots/OpenCulturas_interactive-maps.png
      - screenshots/OpenCulturas_intuitive-interface.png