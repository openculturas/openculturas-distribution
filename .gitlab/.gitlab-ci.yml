workflow:
  auto_cancel:
    on_new_commit: interruptible

include:
  - project: 'devops/gitlab-ci-templates'
    ref: 3.2.25
    file:
      - 'drupal.yml'

default:
  image: docker:29.10.0@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c

stages:
  - ".pre"
  - validate
  - build
  - deploy
  - cronjobs
  - release
  - ".post"

variables:
  CLOUDRON_DB_SOURCE: 'gitrepo'
  # Skill/AGENTS.md files are versioned; only sync locally after a real
  # `composer update` of drupal/ai_best_practices, never on CI's fresh installs.
  AI_BEST_PRACTICES_SKIP_PACKAGE_SYNC: 1

renovate:update-artifacts:
  extends: .renovate:update-artifacts
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.4:v7.0.274201@sha256:4e52d476b267a7b73e44b142a6585782c0de9360964875bb188ee70192f78ee0
  before_script:
    - mkdir --parents --verbose /app/code
    - rsync --archive --exclude=.composer --exclude=.npm . /app/code
    - cd /app/code
    - git config user.email "$GITLAB_USER_EMAIL" && git config user.name "$GITLAB_USER_NAME"
    - git remote set-url origin "$CI_PROJECT_URL"
    - |
      if [[ ${CI_PROJECT_URL} =~ (([^/]*/){3}) ]]; then
        mkdir --parents "$HOME/.config/git"
        echo "${BASH_REMATCH[1]/:\/\//://gitlab-ci-token:${GL_TOKEN:-$GITLAB_TOKEN}@}" > "$HOME/.config/git/credentials"
        git config --global credential.helper store
      fi
    # The target branch may not contain the script yet.
    - cp .gitlab/renovate-update-artifacts.sh .gitlab/ci-renovate-functions.sh /tmp/
  script:
    - bash /tmp/renovate-update-artifacts.sh
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(renovate\): update artifacts/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $UPDATE_ARTIFACTS
    - if: '($CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ $RENOVATE_BRANCH_PREFIX_PATTERN)'

.composer:
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.4:v7.0.274201@sha256:4e52d476b267a7b73e44b142a6585782c0de9360964875bb188ee70192f78ee0
  stage: validate
  variables:
    COMPOSER_EXIT_ON_PATCH_FAILURE: 1
    COMPOSER_MEMORY_LIMIT: -1

# Protected branches only receive merged code that already passed validation.
.no_protected_run:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: never

.validate_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - !reference [.no_protected_run, rules]

.validate_rules_php:
  rules:
    - !reference [.validate_rules, rules]
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - composer.json
          - composer.lock
          - "**/*.{php,install,module}"

composer validate:
  extends: .composer
  stage: validate
  interruptible: true
  script:
    - composer validate --ansi --check-lock
  rules:
    - !reference [.validate_rules_php, rules]

phplint:
  extends:
    - .composer
    - .validate_rules_php
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/parallel-lint --show-deprecated -e php,module,install,profile,theme profile

🧹 PHP Coding standards (PHPCS):
  extends:
    - .composer
    - .validate_rules_php
  needs:
    - phplint
  stage: validate
  interruptible: true
  allow_failure: true
  script:
    - composer install --ansi --no-interaction
    - composer run php:cs -- --report-junit=junit.xml --report-full --report-summary --report-source || EXIT_CODE=$?
    - if [[ $EXIT_CODE == "" ]]; then echo "There are no PHPCS coding standards errors or warnings"; fi
    - echo "Exiting with EXIT_CODE=$EXIT_CODE" && exit $EXIT_CODE
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 6 mos
    reports:
      junit: [junit.xml]

🧹 PHP Static Analysis (phpstan) :
  extends:
    - .composer
    - .validate_rules_php
  needs:
    - phplint
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - php $CI_PROJECT_DIR/vendor/bin/phpstan --configuration=phpstan.ci.neon --no-progress --error-format=junit analyze > $CI_PROJECT_DIR/junit.xml || true
    - php $CI_PROJECT_DIR/vendor/bin/phpstan --configuration=phpstan.ci.neon --no-progress analyze || EXIT_CODE=$?
    - exit $EXIT_CODE
  cache:
    - key: phpstan
      paths:
        - .phpstancache
      when: always
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 6 mos
    reports:
      junit: [junit.xml]

rector dry-run:
  extends:
    - .composer
    - .validate_rules_php
  needs:
    - phplint
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/rector --no-progress-bar --dry-run
  cache:
    - key: rector
      paths:
        - .rectorcache
      when: always

.validate_rules_npm:
  rules:
    - !reference [.validate_rules, rules]
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - package.json
          - package-lock.json
          - "**/package.json"
          - "**/package-lock.json"
          - "**/*.{scss,css,js}"

.npm:
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.4:v7.0.274201@sha256:4e52d476b267a7b73e44b142a6585782c0de9360964875bb188ee70192f78ee0
  stage: validate
  extends: .validate_rules_npm
  needs:
    - job: phplint
      optional: true

.composer_npm:
  extends:
    - .composer
    - .npm

.stylelint:
  extends: .composer_npm
  stage: validate
  interruptible: true
  before_script:
    - composer install --ansi --no-interaction
    - npm ci --no-audit --prefer-offline
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      junit: [junit.xml]
  allow_failure: true

🧹 SCSS linting (stylelint):
  extends: .stylelint
  cache:
    - key: stylelint-scss
      paths:
        - .stylelintcache
      when: always
  script:
    - npm run lint:scss -- --cache --cache-location .stylelintcache --cache-strategy content --color || EXIT_CODE=$?
    - npm run lint:scss -- --cache --cache-location .stylelintcache --cache-strategy content --custom-formatter=stylelint-junit-formatter --output-file=$CI_PROJECT_DIR/junit.xml || true
    - exit ${EXIT_CODE:-0}

🧹 CSS linting (stylelint):
  extends: .stylelint
  cache:
    - key: stylelint-css
      paths:
        - .stylelintcache
      when: always
  script:
    - npm run lint:css -- --cache --cache-location .stylelintcache --cache-strategy content --color || EXIT_CODE=$?
    - npm run lint:css -- --cache --cache-location .stylelintcache --cache-strategy content --custom-formatter=stylelint-junit-formatter --output-file=$CI_PROJECT_DIR/junit.xml || true
    - exit ${EXIT_CODE:-0}

.eslint:
  extends: .composer_npm
  stage: validate
  interruptible: true
  allow_failure: true
  before_script:
    - composer install --ansi --no-interaction
    - npm ci --no-audit --prefer-offline
  cache:
    - key: eslint
      paths:
        - .eslintcache
      when: always
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      junit: [junit.xml]

🧹 JavaScript linting (eslint):
  extends: .eslint
  script:
    - npm run lint:js -- --cache . || EXIT_CODE=$?
    - npm run lint:js -- --cache --format junit --output-file junit.xml . || true
    - exit ${EXIT_CODE:-0}

# Shared setup of the ExistingSite test jobs: imports the shared database
# snapshot, brings it to the state of the branch, starts a web server and runs
# the PHPUnit test suite PHPUNIT_TEST_SUITE.
.existing-site-tests:
  extends: .composer
  stage: validate
  interruptible: true
  variables:
    MYSQL_RANDOM_ROOT_PASSWORD: 1
    MYSQL_USER: app
    MYSQL_PASSWORD: app
    MYSQL_DATABASE: app
    COMPOSER_ALLOW_SUPERUSER: 1
    # Enables the test overrides in .gitlab/ci.settings.local.php.
    OPENCULTURAS_CI_TESTS: 1
    DTT_BASE_URL: http://localhost:8888
    PHP_CLI_SERVER_WORKERS: 4
  services:
    - mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
  script:
    - composer install --ansi --no-interaction --no-progress
    - bash .gitlab/ci-import-database.sh
    # The output goes to a file: a background process that keeps the job
    # output open blocks the end of the job.
    - vendor/bin/drush --root="${PWD}/web" runserver --no-browser 0.0.0.0:8888 > runserver.log 2>&1 &
    - timeout 60 bash -c 'until curl --silent --output /dev/null "${DTT_BASE_URL}"; do sleep 1; done'
    - vendor/bin/phpunit --testsuite "${PHPUNIT_TEST_SUITE}" --log-junit junit.xml
  after_script:
    - vendor/bin/drush watchdog:show --count=50 --severity-min=Warning --ansi || true
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 1 mos
    paths:
      - runserver.log
    reports:
      junit: [junit.xml]

# Runs automatically in pipeline schedules with the variable
# EXISTING_SITE_TESTS and on Renovate branches that update relevant
# dependencies, manually on other branches.
🧪 PHPUnit (existing-site):
  extends: .existing-site-tests
  # On Renovate branches, wait for the artifacts job. When it pushes a commit,
  # the new pipeline cancels this one and tests the updated artifacts.
  needs:
    - job: renovate:update-artifacts
      optional: true
      artifacts: false
  variables:
    PHPUNIT_TEST_SUITE: existing-site
  before_script:
    # On Renovate branches, skip the tests when no relevant Composer package
    # changed, e.g. for updates of npm packages, CI images or code analysis
    # tools. Set UPDATE_ARTIFACTS to run the tests anyway.
    - |
      if [[ ${CI_COMMIT_BRANCH:-} =~ ^renovate_ && -z ${UPDATE_ARTIFACTS:-} ]]; then
        source .gitlab/ci-renovate-functions.sh
        merge_base="$(determine_renovate_merge_base)"
        changed_exit_code=0
        bash .gitlab/test-relevant-changes.sh "${merge_base}" || changed_exit_code=$?
        if [[ ${changed_exit_code} -eq 10 ]]; then
          exit 0
        elif [[ ${changed_exit_code} -ne 0 ]]; then
          exit "${changed_exit_code}"
        fi
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $EXISTING_SITE_TESTS
    # A failure blocks the automerge of Renovate updates.
    - if: $CI_COMMIT_BRANCH =~ /^renovate_/
    - !reference [.validate_rules, rules]
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# Runs the JavaScript tests in Chromium. The browser runs in the selenium-chrome
# service and loads the site from the web server in the job container, which
# the service reaches through the network alias "build". Runs automatically in
# pipeline schedules with the variable EXISTING_SITE_TESTS, manually on other
# branches.
🧪 PHPUnit (existing-site-javascript):
  extends: .existing-site-tests
  needs: []
  variables:
    PHPUNIT_TEST_SUITE: existing-site-javascript
    # Puts the job and its services into one network, so that the services can
    # reach the job container.
    FF_NETWORK_PER_BUILD: "true"
    DTT_BASE_URL: http://build:8888
    # Same Chrome options as in .ddev/config.selenium-standalone-chrome.yaml.
    DTT_MINK_DRIVER_ARGS: '["chrome", {"browserName":"chrome","goog:chromeOptions":{"w3c":true,"args":["--disable-dev-shm-usage","--disable-gpu","--headless","--dns-prefetch-disable","--disable-features=DeferRendererTasksAfterInput"]}}, "http://selenium-chrome:4444/wd/hub"]'
  services:
    - mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    # Same image as SELENIUM_CHROME_DOCKER_IMAGE in .ddev/.env.selenium-chrome.
    # Renovate updates both in one merge request.
    - name: selenium/standalone-chromium:155.0@sha256:c7c17cd79c62819a8329df00e610dbc4073c279da034a6f37135d454eb0d8870
      alias: selenium-chrome
  before_script:
    - |
      timeout 120 bash -c 'until curl --silent http://selenium-chrome:4444/status | grep --quiet "\"ready\": *true"; do sleep 2; done'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $EXISTING_SITE_TESTS
    - !reference [.validate_rules, rules]
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

build:artifacts:
  extends: .build:artifacts
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.4:v7.0.274201@sha256:4e52d476b267a7b73e44b142a6585782c0de9360964875bb188ee70192f78ee0
  rules:
    # The prelive deployment needs the artifacts.
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME != $PRELIVE_BRANCH_NAME
      when: never
    - !reference [.composer:install, rules]

.docker_build_image:
  needs:
    - job: build:image:base
      optional: true
    - job: build:artifacts
      artifacts: true

# Template job: only its rules are overridden, because it needs build:artifacts.
build:image:stage:dry-run:
  rules:
    - !reference [.no_protected_run, rules]
    - !reference [.only_stage_rules_no_default, rules]

build:image:stage:
  rules:
    - !reference [.no_protected_run, rules]
    - !reference [.only_stage_rules_manually_optional, rules]

deploy:stage:
  extends:
    - .deploy_cloudron:stage
  needs:
    - build:image:stage
  rules:
    - !reference [.no_protected_run, rules]
    - !reference [.only_stage_rules_manually_optional, rules]

deploy:stage:remove:
  extends: .deploy_cloudron:stage:remove
  needs:
    - deploy:stage
  rules:
    - !reference [.no_protected_run, rules]
    - !reference [.only_stage_rules_manually_optional, rules]

build:image:prelive:
  extends: .build:image:prelive

deploy:prelive:
  extends: .deploy_cloudron:prelive
  needs:
    - build:image:prelive

database:snapshot:
  extends: .pre_cloudron
  stage: cronjobs
  variables:
    APP_ENV: stage
  script:
    - bash ${DEBUG:+-o xtrace} /ci/cloudron/db_snapshot.sh
  rules:
    - if: $DB_CREATE_SNAPSHOT

🔍 npm audit:
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.4:v7.0.274201@sha256:4e52d476b267a7b73e44b142a6585782c0de9360964875bb188ee70192f78ee0
  stage: cronjobs
  needs: []
  script:
    - |
      EXIT_CODE=0
      for directory in . profile/themes/openculturas_base profile/themes/opcult; do
        echo "== npm audit: ${directory} =="
        npm --prefix "${directory}" ci --no-audit --prefer-offline
        npm --prefix "${directory}" audit --audit-level=moderate || EXIT_CODE=$?
      done
      exit "${EXIT_CODE}"
  rules:
    - if: $NPM_AUDIT_CHECK

test create project:
  extends: .composer
  needs: []
  script:
    - composer create-project --remove-vcs --no-interaction --ansi drupal/openculturas_project example.org
    - cd example.org
    - composer audit --locked --no-interaction --ansi --abandoned=report
    - composer update --prefer-lowest --no-interaction --ansi
  # Enable when https://www.drupal.org/project/smtp/issues/3352909 is fixed.
  #  - composer audit --locked --no-interaction --ansi
  rules:
    - if: $TEST_COMPOSER_CREATE_PROJECT
