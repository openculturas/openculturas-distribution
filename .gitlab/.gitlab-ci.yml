include:
  - project: 'devops/gitlab-ci-templates'
    ref: 3.0.0
    file:
      - 'drupal.yml'

workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - ".pre"
  - validate
  - build
  - deploy
  - cronjobs
  - release
  - ".post"

variables:
  CLOUDRON_DB_SOURCE: 'gitrepo'

docker:base:
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - echo $BASE_IMAGE_CI_REGISTRY_PASSWORD | docker login -u "$BASE_IMAGE_CI_REGISTRY_USER" --password-stdin $BASE_IMAGE_CI_REGISTRY
    - docker build --file ./.gitlab/DockerfileBase --pull --rm --tag ${CI_REGISTRY_IMAGE}:base
      --build-arg CI_PROJECT_NAME=${CI_PROJECT_NAME}
      --secret id=BASICAUTH_PASSWORD
      .
    - docker push ${CI_REGISTRY_IMAGE}:base

.docker_build_image:
  script:
  - DOCKER_IMAGE_TAG="${CI_JOB_ID}"
  - echo "DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG}" >> deploy.env
  - echo $CI_REGISTRY_PASSWORD | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  - echo $BASE_IMAGE_CI_REGISTRY_PASSWORD | docker login -u "$BASE_IMAGE_CI_REGISTRY_USER" --password-stdin $BASE_IMAGE_CI_REGISTRY
  - docker build --file ./.gitlab/DockerfileApp --rm --tag "${DOCKER_IMAGE_MIRROR_CI_REGISTRY_IMAGE}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${DOCKER_IMAGE_TAG}"
    --build-arg APP_ENV=${APP_ENV} --build-arg CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
    .
  - echo $DOCKER_IMAGE_MIRROR_CI_REGISTRY_PASSWORD | docker login -u "$DOCKER_IMAGE_MIRROR_CI_REGISTRY_USER"
    --password-stdin $DOCKER_IMAGE_MIRROR_CI_REGISTRY
  - docker push "${DOCKER_IMAGE_MIRROR_CI_REGISTRY_IMAGE}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${DOCKER_IMAGE_TAG}"

.composer:
  image: registry.gzevd.de/safeserver/cloudron-base:v7-php8.1-sdk@sha256:cad8574e045043cb3a14f3bb5ea50d28e88ef6debc4d3a163eed01aaa82a01ca
  stage: validate
  needs:
    - docker:base
  variables:
    COMPOSER_EXIT_ON_PATCH_FAILURE: 1
    COMPOSER_MEMORY_LIMIT: -1

composer validate:
  extends: .composer
  stage: validate
  interruptible: true
  script:
    - composer validate --ansi --check-lock
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "composer.json"
          - "composer.lock"

.validate_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_BRANCH

phplint:
  extends:
    - .composer
    - .validate_rules
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/parallel-lint --show-deprecated -e php,module,install,profile,theme --gitlab profile > gl-code-quality-report.json
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

phpcs:
  extends:
    - .composer
    - .validate_rules
  needs:
    - phplint
  stage: validate
  interruptible: true
  allow_failure: true
  script:
    - composer install --ansi --no-interaction
    - composer run php:cs -- --report=full --report-\\Micheh\\PhpCodeSniffer\\Report\\Gitlab=gl-code-quality-report.json
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

phpstan:
  extends:
    - .composer
    - .validate_rules
  needs:
    - phplint
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/phpstan.phar --configuration=phpstan.ci.neon --no-interaction --no-progress --error-format=gitlab > gl-code-quality-report.json
  cache:
    - key: phpstan
      paths:
        - .phpstancache
      when: always
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

rector dry-run:
  extends:
    - .composer
    - .validate_rules
  needs:
    - phplint
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/rector --no-progress-bar --dry-run
  cache:
    - key: rector
      paths:
        - .rectorcache
      when: always
#  artifacts:
#    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
#    when: always
#    reports:
#      codequality: [gl-code-quality-report.json]

.npm:
  image: registry.gzevd.de/safeserver/cloudron-base:v7-php8.1-sdk@sha256:cad8574e045043cb3a14f3bb5ea50d28e88ef6debc4d3a163eed01aaa82a01ca
  stage: validate
  extends: .validate_rules
  needs:
    - docker:base
    - phplint

.composer_npm:
  extends:
    - .composer
    - .npm

.stylelint:
  extends: .composer_npm
  stage: validate
  interruptible: true
  before_script:
    - composer install --ansi --no-interaction
    - npm ci --no-audit --prefer-offline
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]
  allow_failure: true

lint scss:
  extends: .stylelint
  cache:
    - key: stylelint-scss
      paths:
        - .stylelintcache
      when: always
  script:
    - npm run lint:scss -- --cache --cache-location .stylelintcache --cache-strategy content --color  --custom-formatter=@gitlab-formatters/stylelint-formatter-gitlab --output-file=$CI_PROJECT_DIR/gl-code-quality-report.json

lint css:
  extends: .stylelint
  cache:
    - key: stylelint-css
      paths:
        - .stylelintcache
      when: always
  script:
    - npm run lint:css -- --cache --cache-location .stylelintcache --cache-strategy content --color  --custom-formatter=@gitlab-formatters/stylelint-formatter-gitlab --output-file=$CI_PROJECT_DIR/gl-code-quality-report.json

.eslint:
  extends: .composer_npm
  stage: validate
  interruptible: true
  allow_failure: true
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-code-quality-report.json
  before_script:
    - composer install --ansi --no-interaction
    - npm ci --no-audit --prefer-offline
  cache:
    - key: eslint
      paths:
        - .eslintcache
      when: always
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

eslint:
  extends: .eslint
  script:
    - npx eslint --cache --format gitlab .

build:image:stage:
  extends: .build:image:stage

deploy:stage:
  extends:
    - .deploy_cloudron:stage
    - .only_stage_rules_manually
  needs:
    - build:image:stage

deploy:stage:remove:
  extends: .deploy_cloudron:stage:remove
  needs:
    - deploy:stage

build:image:prelive:
  extends: .build:image:prelive

deploy:prelive:
  extends: .deploy_cloudron:prelive
  needs:
    - build:image:prelive

database:snapshot:
  extends: .pre_cloudron
  stage: cronjobs
  variables:
    APP_ENV: stage
  script:
    - bash ${DEBUG:+-o xtrace} /ci/cloudron/db_snapshot.sh
  rules:
    - if: $DB_CREATE_SNAPSHOT

test create project:
  extends: .composer
  needs: []
  script:
    - composer create-project --remove-vcs --no-interaction --ansi drupal/openculturas_project example.org
    - cd example.org
    - composer audit --locked --no-interaction --ansi
    - composer update --prefer-lowest --no-interaction --ansi
  # Enable when https://www.drupal.org/project/smtp/issues/3352909 is fixed.
  #  - composer audit --locked --no-interaction --ansi
  rules:
    - if: $TEST_COMPOSER_CREATE_PROJECT
