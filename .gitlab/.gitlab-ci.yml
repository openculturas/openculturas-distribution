workflow:
  auto_cancel:
    on_new_commit: interruptible

include:
  - project: 'devops/gitlab-ci-templates'
    ref: 3.1.9
    file:
      - 'drupal.yml'

stages:
  - ".pre"
  - validate
  - build
  - deploy
  - cronjobs
  - release
  - ".post"

variables:
  CLOUDRON_DB_SOURCE: 'gitrepo'

.composer:
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.1:v7.0.220531@sha256:4bd13efc2a8b72a0f1a4aefe20daea87a9e29189d47f9a33ebcf7976ea20b0b4
  stage: validate
  variables:
    COMPOSER_EXIT_ON_PATCH_FAILURE: 1
    COMPOSER_MEMORY_LIMIT: -1

.validate_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_PROTECTED

.validate_rules_php:
  rules:
    - !reference [.validate_rules, rules]
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - composer.json
          - composer.lock
          - "**/*.{php,install,module}"

composer validate:
  extends: .composer
  stage: validate
  interruptible: true
  script:
    - composer validate --ansi --check-lock
  rules:
    - !reference [.validate_rules_php, rules]

phplint:
  extends:
    - .composer
    - .validate_rules_php
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/parallel-lint --show-deprecated -e php,module,install,profile,theme --gitlab profile > gl-code-quality-report.json
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

phpcs:
  extends:
    - .composer
    - .validate_rules_php
  needs:
    - phplint
  stage: validate
  interruptible: true
  allow_failure: true
  script:
    - composer install --ansi --no-interaction
    - composer run php:cs -- --report=full --report-\\Micheh\\PhpCodeSniffer\\Report\\Gitlab=gl-code-quality-report.json
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

phpstan:
  extends:
    - .composer
    - .validate_rules_php
  needs:
    - phplint
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/phpstan.phar --configuration=phpstan.ci.neon --no-interaction --no-progress --error-format=gitlab > gl-code-quality-report.json
  cache:
    - key: phpstan
      paths:
        - .phpstancache
      when: always
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

rector dry-run:
  extends:
    - .composer
    - .validate_rules_php
  needs:
    - phplint
  stage: validate
  interruptible: true
  script:
    - composer install --ansi --no-interaction
    - vendor/bin/rector --no-progress-bar --dry-run
  cache:
    - key: rector
      paths:
        - .rectorcache
      when: always
#  artifacts:
#    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
#    when: always
#    reports:
#      codequality: [gl-code-quality-report.json]

.validate_rules_npm:
  rules:
    - !reference [.validate_rules, rules]
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - package.json
          - package-lock.json
          - "**/package.json"
          - "**/package-lock.json"
          - "**/*.{scss,css,js}"

.npm:
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.1:v7.0.220531@sha256:4bd13efc2a8b72a0f1a4aefe20daea87a9e29189d47f9a33ebcf7976ea20b0b4
  stage: validate
  extends: .validate_rules_npm
  needs:
    - phplint

.composer_npm:
  extends:
    - .composer
    - .npm

.stylelint:
  extends: .composer_npm
  stage: validate
  interruptible: true
  before_script:
    - composer install --ansi --no-interaction
    - npm ci --no-audit --prefer-offline
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]
  allow_failure: true

lint scss:
  extends: .stylelint
  cache:
    - key: stylelint-scss
      paths:
        - .stylelintcache
      when: always
  script:
    - npm run lint:scss -- --cache --cache-location .stylelintcache --cache-strategy content --color  --custom-formatter=@gitlab-formatters/stylelint-formatter-gitlab --output-file=$CI_PROJECT_DIR/gl-code-quality-report.json

lint css:
  extends: .stylelint
  cache:
    - key: stylelint-css
      paths:
        - .stylelintcache
      when: always
  script:
    - npm run lint:css -- --cache --cache-location .stylelintcache --cache-strategy content --color  --custom-formatter=@gitlab-formatters/stylelint-formatter-gitlab --output-file=$CI_PROJECT_DIR/gl-code-quality-report.json

.eslint:
  extends: .composer_npm
  stage: validate
  interruptible: true
  allow_failure: true
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-code-quality-report.json
  before_script:
    - composer install --ansi --no-interaction
    - npm ci --no-audit --prefer-offline
  cache:
    - key: eslint
      paths:
        - .eslintcache
      when: always
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    when: always
    reports:
      codequality: [gl-code-quality-report.json]

eslint:
  extends: .eslint
  script:
    - npx eslint --cache --format gitlab .

build:artifacts:
  extends: .build:artifacts
  image: registry.gzevd.de/safeserver/cloudron-base/sdk/php-8.1:v7.0.220531@sha256:4bd13efc2a8b72a0f1a4aefe20daea87a9e29189d47f9a33ebcf7976ea20b0b4

.docker_build_image:
  needs:
    - job: build:image:base
      optional: true
    - job: build:artifacts
      artifacts: true

deploy:stage:
  extends:
    - .deploy_cloudron:stage
  needs:
    - build:image:stage

deploy:stage:remove:
  extends: .deploy_cloudron:stage:remove
  needs:
    - deploy:stage

build:image:prelive:
  extends: .build:image:prelive

deploy:prelive:
  extends: .deploy_cloudron:prelive
  needs:
    - build:image:prelive

database:snapshot:
  extends: .pre_cloudron
  stage: cronjobs
  variables:
    APP_ENV: stage
  script:
    - bash ${DEBUG:+-o xtrace} /ci/cloudron/db_snapshot.sh
  rules:
    - if: $DB_CREATE_SNAPSHOT

test create project:
  extends: .composer
  needs: []
  script:
    - composer create-project --remove-vcs --no-interaction --ansi drupal/openculturas_project example.org
    - cd example.org
    - composer audit --locked --no-interaction --ansi
    - composer update --prefer-lowest --no-interaction --ansi
  # Enable when https://www.drupal.org/project/smtp/issues/3352909 is fixed.
  #  - composer audit --locked --no-interaction --ansi
  rules:
    - if: $TEST_COMPOSER_CREATE_PROJECT
