slim_select:
  remote: https://slimselectjs.com/
  license:
    name: MIT
    url: https://github.com/brianvoe/slim-select/blob/master/LICENSE
    gpl-compatible: true
  js:
    /libraries/slim-select/dist/slimselect.min.js: { minified: true, attributes: { defer: true } }
  css:
    component:
      /libraries/slim-select/dist/slimselect.css: { minified: true, attributes: { defer: true } }

openculturas_slimselect:
  js:
    js/openculturas_slimselect.js: { attributes: { defer: true } }
  dependencies:
    - openculturas_slimselect/slim_select
    - core/drupal
    - core/once
