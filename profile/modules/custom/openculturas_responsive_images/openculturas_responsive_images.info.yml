name: 'OpenCulturas - Responsive images'
type: module
core_version_requirement: ^11
description: 'Responsive image styles and crop types, plus a migration tool for existing image crops.'
package: OpenCulturas
version: 3.2.x-dev
project: openculturas
configure: openculturas_responsive_images.settings
dependencies:
  - 'crop:crop'
  - 'drupal:responsive_image'
  - 'svg_image:svg_image_responsive'

config_devel:
  install:
    - crop.type.oc_1_1
    - crop.type.oc_2_1
    - crop.type.oc_3_4
    - crop.type.oc_4_3
    - crop.type.oc_9_16
    - crop.type.oc_16_9
    - image.style.oc_1_1_400
    - image.style.oc_1_1_800
    - image.style.oc_1_1_1200
    - image.style.oc_1_1_1600
    - image.style.oc_1_1_2000
    - image.style.oc_2_1_400
    - image.style.oc_2_1_800
    - image.style.oc_2_1_1200
    - image.style.oc_2_1_1600
    - image.style.oc_2_1_2000
    - image.style.oc_3_4_400
    - image.style.oc_3_4_600
    - image.style.oc_3_4_800
    - image.style.oc_3_4_1200
    - image.style.oc_4_3_400
    - image.style.oc_4_3_800
    - image.style.oc_4_3_1200
    - image.style.oc_4_3_1600
    - image.style.oc_4_3_2000
    - image.style.oc_9_16_400
    - image.style.oc_9_16_600
    - image.style.oc_9_16_800
    - image.style.oc_9_16_1200
    - image.style.oc_16_9_400
    - image.style.oc_16_9_800
    - image.style.oc_16_9_1200
    - image.style.oc_16_9_1600
    - image.style.oc_16_9_2000
    - image.style.oc_bounds_400_300
    - image.style.oc_bounds_600_450
    - image.style.oc_bounds_800_600
    - image.style.oc_bounds_1200_900
    - image.style.oc_bounds_1600_1200
    - responsive_image.styles.oc_1_1
    - responsive_image.styles.oc_1_1_profile
    - responsive_image.styles.oc_2_1
    - responsive_image.styles.oc_3_4
    - responsive_image.styles.oc_4_3
