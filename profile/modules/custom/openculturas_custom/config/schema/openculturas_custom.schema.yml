condition.plugin.user_page:
  type: condition.plugin
  mapping:
    enabled:
      type: boolean
    only_for_owner:
      type: boolean


openculturas_custom.eca_notification_recipient.*:
  type: config_entity
  label: ECA notification recipient
  mapping:
    id:
      type: string
      label: ID
    label:
      type: string
      label: Label
    eca_model:
      type: sequence
      sequence:
        type: boolean
    preferred_langcode:
      type: string

openculturas_custom.settings:
  type: config_object
  label: 'OpenCulturas - Customizing settings'
  mapping:
    allowed_classes:
      type: sequence
      label: 'List of allowed classes'
      sequence:
        type: string
        label: 'Label of class'
    mailsignature:
      type: string
      label: 'Email signature'

block.settings.openculturas_custom_page_title:
  type: block_settings
  label: 'Page title block'
  mapping:
    subheadline_display:
      type: boolean
      label: 'Subheadline (tagline)'
    subtype_display:
      type: boolean
      label: 'Sub type'
    profilepicture_display:
      type: boolean
      label: 'Profile picture'

entity_reference_selection.views_autocreate:
  type: entity_reference_selection.views
  label: 'Views with autocreate selection handler settings'
  mapping:
    target_bundles:
      type: sequence
      label: 'Bundles of new entities'
      nullable: true
      sequence:
        type: string
        label: 'Bundle'
    auto_create:
      type: boolean
      label: 'Create referenced entities if they don''t already exist'
    auto_create_bundle:
      type: string
      label: 'Bundle assigned to the auto-created entities.'
      nullable: true

views.field.non_translatable_custom:
  type: views_field
  label: 'Custom (non translatable)'
  mapping:
    alter:
      type: mapping
      label: 'Rewrite results'
      mapping:
        text:
          type: string
          label: 'Text'
        path:
          type: string
          label: 'Link path'
        alt:
          type: string
          label: 'Title text'
        prefix:
          type: string
          label: 'Prefix text'
        suffix:
          type: string
          label: 'Suffix text'
        more_link_text:
          type: string
          label: 'More link label'
