    body:
      -
        value: '<blockquote class="plain"><p><span class="mark">Ihr könnt gerne Auszüge aus folgendem Text als Grundlage für eure eigene Datenschutzerklärung verwenden. Bitte seid euch aber bewusst, dass es vollständig in eurer Verantwortung als Betreiber:in liegt, dass diese Seite für eure konkrete Instanz korrekt, vollständig und aktuell ist. Das gilt insbesondere, wenn zusätzliche Module installiert werden, die personenbezogene Daten verarbeiten oder an Dritte weitergeben — solche Module können Datenverarbeitungen mit sich bringen, die von dieser Vorlage nicht abgedeckt sind und separat dokumentiert werden müssen. Das Ganze ist natürlich keine Rechtsberatung ;-)</span></p></blockquote><hr><p>Verantwortlicher im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:</p><p><span class="mark">[Name des Verantwortlichen / Unternehmen]</span><br><span class="mark">[Vollständige Postanschrift]&nbsp;</span><br><span class="mark">E-Mail: [Kontakt-E-Mail-Adresse für Datenschutzanfragen]</span></p><p>Wir verarbeiten personenbezogene Daten nur in dem Umfang, der erforderlich ist, um diese Website bereitzustellen und ihre Stabilität, Sicherheit und Reichweitenmessung zu gewährleisten.</p><p>Beim Aufruf dieser Website werden durch den Webserver bzw. Hosting-Anbieter technisch notwendige Daten in Server-Logdateien verarbeitet. Dazu können insbesondere eure IP-Adresse, Datum und Uhrzeit des Zugriffs, die abgerufene Seite oder Datei, die Referrer-URL, Browsertyp und -version sowie das verwendete Betriebssystem gehören. Diese Verarbeitung erfolgt, um die Website bereitzustellen sowie die Stabilität, Sicherheit und Integrität unserer informationstechnischen Systeme zu gewährleisten.</p><p>Rechtsgrundlage für diese Verarbeitung ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse liegt im technisch sicheren, stabilen und missbrauchsfreien Betrieb der Website.</p><h2>Cookies</h2><p>Logdateien werden nach <span class="mark">[XX Tagen]</span> gelöscht, sofern keine gesetzlichen Aufbewahrungspflichten entgegenstehen oder eine längere Speicherung im Einzelfall zur Aufklärung konkreter Sicherheitsvorfälle erforderlich ist.</p><blockquote class="plain"><p><span class="mark">Hinweis: Die genaue Speicherdauer und ob die IP-Adresse vollständig oder gekürzt gespeichert wird, hängt von der Standardkonfiguration eures Hosting-Anbieters bzw. euren eigenen Servereinstellungen ab. Klärt dies vor der Veröffentlichung mit eurem Hosting-Anbieter (bzw. bei Self-Hosting mit eurem eigenen Admin-/DevOps-Team) ab.</span></p></blockquote><p>Diese Website verwendet ausschließlich ein technisch notwendiges Session-Cookie. In diesem Cookie wird eine Session-ID gespeichert, um eure Sitzung bereitzustellen und aufrechtzuerhalten. Die Verarbeitung personenbezogener Daten im Zusammenhang mit dem Session-Cookie erfolgt auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO. Soweit § 25 des Telekommunikation-Digitale-Dienste-Datenschutz-Gesetzes (TDDDG) auf die Speicherung von oder den Zugriff auf Informationen auf Ihrem Endgerät anwendbar ist, erfolgt dies ausschließlich im Rahmen der gesetzlichen Ausnahme für unbedingt erforderliche Vorgänge.&nbsp;</p><h3>Externe Videoplattformen</h3><p>Diese Website ermöglicht die Einbindung externer Videos von YouTube und Vimeo. Diese Videos werden nicht automatisch geladen; Inhalte werden erst dann vom jeweiligen Anbieter abgerufen, wenn ihr über unser Consent-Management-Tool ("Cookie-Banner") ausdrücklich zugestimmt habt.</p><p>Bei erteilter Einwilligung laden YouTube (betrieben von Google Ireland Limited bzw. dessen Muttergesellschaft Google LLC) oder Vimeo (betrieben von Vimeo.com, Inc.) Inhalte direkt in euren Browser und können dabei personenbezogene Daten wie eure IP-Adresse, Browser- und Geräteinformationen sowie Informationen zu eurem Wiedergabeverhalten verarbeiten, gegebenenfalls auch für eigene Zwecke. Sofern diese Anbieter außerhalb der EU/des EWR ansässig sind, kann dies eine Übermittlung personenbezogener Daten in die USA beinhalten.</p><p>Rechtsgrundlage für diese Verarbeitung ist eure Einwilligung gemäß Art. 6 Abs. 1 lit. a DSGVO. Ihr könnt eure Einwilligung jederzeit mit Wirkung für die Zukunft über den Link <a href="#editCookieSettings">Cookie-Einstellungen bearbeiten</a> widerrufen (ebenfalls global im Footer der Website verlinkt).</p><p>Weitere Informationen zur eigenen Datenverarbeitung der jeweiligen Anbieter finden ihr in deren Datenschutzerklärungen:</p><ul><li data-list-item-id="e85e58f700a2a5bcd4ad912fa1f342cfc">YouTube/Google: <span class="mark">[Aktueller Link zur Datenschutzerklärung von Google]</span></li><li data-list-item-id="e22afd20d3016e5faae391ef0b22ffa46">Vimeo: <span class="mark">[Aktueller Link zur Datenschutzerklärung von Vimeo]</span></li></ul><blockquote class="plain"><p><span class="mark">Hinweis: Dieser Abschnitt gilt nur, wenn die Einbindung von Videos auf eurer Instanz tatsächlich aktiviert ist und euer Consent-Management-Tool so konfiguriert ist, dass YouTube-/Vimeo-Inhalte erst nach ausdrücklicher Einwilligung geladen werden. Tragt den tatsächlichen Namen und, falls hilfreich, einen direkten Link zu eurem Consent-Management-Tool ein. Wenn ihr eine alternative Consent-Management-Plattform verwendet, prüft, ob diese YouTube und Vimeo als separate "Dienste" benennt oder unter einer allgemeinen Kategorie "Video" zusammenfasst — passt den obigen Text entsprechend an. Ist nur eine der beiden Plattformen (YouTube oder Vimeo) tatsächlich aktiviert, entfernt die Verweise auf die andere.</span></p></blockquote><h2>Analytics</h2><p><span class="mark">Falls ihr einen Analytics-/Tracking-Dienst einbindet, ergänzt hier einen entsprechenden Passus — andernfalls streicht diesen Teil.</span></p><h2>Weitergabe personenbezogener Daten an Dritte</h2><p>Empfänger personenbezogener Daten können technische Dienstleister sein, die mit dem Betrieb, der Bereitstellung und der Wartung dieser Website sowie der eingesetzten Webanalyse betraut sind, insbesondere Hosting- und IT-Dienstleister. Soweit solche Dienstleister in unserem Auftrag tätig sind, erfolgt dies im Rahmen von Verträgen zur Auftragsverarbeitung gemäß Art. 28 DSGVO.</p><p><span class="mark"><strong>Hinweis:</strong> Je nach Rechtsraum oder interner Richtlinie kann es erforderlich sein (oder aus Transparenzgründen sinnvoll), hier eure tatsächlichen Hosting-/IT-Dienstleister namentlich zu benennen. Klärt dies mit denjenigen ab, die eure Hosting-Verträge verwalten.&nbsp;</span></p><p>Personenbezogene Daten werden <span class="mark">[nicht an Empfänger in Ländern außerhalb der Europäischen Union (EU) oder des Europäischen Wirtschaftsraums (EWR) übermittelt]</span>.</p><blockquote class="plain"><p><span class="mark"><strong>Hinweis:</strong> Die Aussagen in diesem Abschnitt sind nur zutreffend, wenn eure gesamte Infrastruktur — Hosting, Analytics-Dienst, Backups, CDN, E-Mail-Versand usw. — tatsächlich innerhalb der EU/des EWR liegt und kein zusätzliches Modul Daten an Nicht-EU-Dienste sendet (z. B. US-basierte APIs, Schriften, Karten oder Embeds). Prüft dies mit eurem Hosting-Anbieter und überprüft alle zusätzlich installierten Module. Falls doch eine Drittstaatenübermittlung erfolgt, muss dieser Absatz durch Angaben zum verwendeten Übermittlungsmechanismus ersetzt werden (z. B. Angemessenheitsbeschluss, Standardvertragsklauseln).</span></p><p><span class="mark">&nbsp;OpenCulturas verwendet standardmäßig in der Plattform enthaltene Schriftarten, die vom eigenen Webserver ausgeliefert werden, sodass keine Drittanbieter-Anfragen für Schriften erfolgen. Kartenkacheln werden von OpenStreetMap bereitgestellt. Laut Eigenaussage von OpenStreetMap findet beim Laden der Kacheln kein Tracking statt; wer vollständig unabhängig von jeglicher Drittanbieter-Anfrage sein möchte, kann die Kartenkacheln zusätzlich selbst hosten.</span></p></blockquote><p>Personenbezogene Daten werden nur so lange gespeichert, wie es zur Erreichung der jeweiligen Verarbeitungszwecke erforderlich ist oder gesetzliche Aufbewahrungspflichten dies vorsehen. Server-Logdateien werden in der Regel nach <span class="mark">[XX Tagen]</span> gelöscht. Im Rahmen der Reichweitenmessung verarbeitete Daten werden nach <span class="mark">[XX Tagen]</span> aggregiert und danach nur noch in einer Form gespeichert, die keinen Personenbezug mehr zulässt, sofern gesetzliche Aufbewahrungspflichten nichts anderes vorsehen.</p><h2>Personenbezogene Daten auf dieser Plattform</h2><p>Die Informationen auf dieser Website können ohne die Erhebung personenbezogener Daten abgerufen werden. Es besteht <strong>keine Registrierungspflicht</strong> für ein Benutzerkonto.</p><blockquote class="plain"><p><span class="mark">Das Folgende gilt, sofern ihr die </span><a href="/admin/config/people/accounts"><span class="mark">Einstellungen zu Registrierung und Kontolöschung</span></a><span class="mark"> nicht ändert.</span></p></blockquote><h3>Benutzerkonto</h3><p>Wird ein Benutzerkonto angelegt, speichern wir folgende Daten:</p><ul><li data-list-item-id="e6f733ed11b9d55190945f3733a017019">E-Mail-Adresse (technisch erforderlich)</li><li data-list-item-id="e76832c620cf2fa4b3277ae3cb53f6192">Benutzername (technisch erforderlich)</li><li data-list-item-id="ee6021ec6eec2c8e87875e03c719d6fd4">Passwort-Hash (also nicht im Klartext)</li><li data-list-item-id="e30b1f3818795f5fffa6de132ffbeb731">Angezeigter Name (optional, aber empfohlen, da er nach außen den Benutzernamen ersetzt)</li><li data-list-item-id="ebd81521c605837ae561a84c3ab5c0adb">Bevorzugte Sprache (optional)</li><li data-list-item-id="e48b4adaba61d42063febc2dee3965c15">Zeitzone (optional)</li></ul><p>Diese Daten werden verwendet, um den Login zu ermöglichen und rollenabhängigen Zugriff auf weitere Informationen/Funktionen bereitzustellen.</p><p>Bestimmte Informationen zur Aktivität eines Benutzerkontos werden aus technischen Gründen für einen begrenzten Zeitraum gespeichert. Dazu gehören beispielsweise:</p><ul><li data-list-item-id="ef6b9a8bb465f4c1cf9c6de8b8b49ab70">Zeitstempel erfolgreicher oder fehlgeschlagener Anmeldeversuche sowie der Abmeldung vom System</li><li data-list-item-id="e4494c0d5fbddef888d5e6764cba787b2">Systemfehlermeldungen, die während der Interaktion eines Nutzers/einer Nutzerin mit dem System entstanden sind (z. B. fehlende Bilder oder Inhaltsseiten)</li></ul><p>Benutzerkonten können von den Nutzer:innen selbst gelöscht werden. Inhalte, die mit diesem Benutzerkonto erstellt wurden, bleiben bestehen, sofern sie nicht zuvor von den Nutzer:innen selbst gelöscht oder "zur Löschung" markiert wurden.</p><h3>Profile</h3><p>Nutzer:innen können (optional) ein oder mehrere Profile anlegen und bearbeiten. Je nach Rolle im System durchlaufen diese Inhalte vor der Veröffentlichung einen Freigabeprozess.</p><p>In Profilen können personenbezogene Daten eingetragen und damit zur Veröffentlichung freigegeben werden, es besteht jedoch keine Verpflichtung dazu:</p><ul><li data-list-item-id="e37c233b3b0f0bf861c54ab5769734ca1">Anschrift</li><li data-list-item-id="e2be285cae01212ca04ef117a87384d96">Kontaktdaten (z. B. Telefonnummer, E-Mail-Adresse, Social-Media-Accounts)</li><li data-list-item-id="eb9d36af06599d76458c6164b606d37c6">Beliebige Informationen im Profiltext (die auch Angaben zu Herkunft, Religion oder Gesundheit enthalten können)</li></ul><p><span class="mark">[Name Betreiber:in]</span> hat keinen Einfluss auf die Angabe solcher Informationen, insbesondere da diese von den für das jeweilige Profil verantwortlichen Benutzerkonten selbst geändert werden können.</p><h3>Missbrauch melden</h3><p>Es besteht die Möglichkeit, irreführend oder missbräuchlich veröffentlichte Informationen zu melden ("Missbrauch melden"), damit die Veröffentlichung umgehend zurückgezogen werden kann. Dies ist beispielsweise relevant, wenn ein Profil im Namen einer Person personenbezogene Informationen veröffentlicht, ohne dass diese Person hierzu ihre Einwilligung gegeben hat. Wir ziehen die Veröffentlichung eines solchen strittigen Inhalts bis zur Klärung des Sachverhalts zurück.</p><h2>Rechte der betroffenen Personen</h2><p>Nach der DSGVO stehen euch insbesondere das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit, Widerspruch sowie der Widerruf einer erteilten Einwilligung mit Wirkung für die Zukunft zu. Ihr habt zudem das Recht, euch bei einer Datenschutz-Aufsichtsbehörde zu beschweren. Zur Ausübung eurer Rechte sendet ihr einfach eine E-Mail an: <span class="mark">[Kontakt-E-Mail-Adresse]</span></p><p>Soweit wir personenbezogene Daten auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO verarbeiten, habt ihr das Recht, jederzeit aus Gründen, die sich aus Ihrer besonderen Situation ergeben, Widerspruch gegen die Verarbeitung einzulegen.</p><p>Die zuständige Aufsichtsbehörde ist:</p><p><span class="mark">[Name der zuständigen Datenschutz-Aufsichtsbehörde]</span><br><span class="mark">[vollständige Postanschrift]&nbsp;</span><br><span class="mark">Tel.: [Telefonnummer]&nbsp;</span><br><span class="mark">E-Mail: [E-Mail-Adresse]</span></p><blockquote class="plain"><p><span class="mark"><strong>Hinweis:</strong> Welche Behörde zuständig ist, hängt vom Sitz des Verantwortlichen ab (bei privaten Unternehmen/Personen) bzw. von der zuständigen öffentlichen Stelle (bei Betreibern im öffentlichen Sektor). Ermittelt die für euer Bundesland zuständige Behörde — eine Liste der deutschen Aufsichtsbehörden findet sich über die Konferenz der unabhängigen Datenschutzaufsichtsbehörden des Bundes und der Länder (DSK).</span></p></blockquote><p>Die Bereitstellung der im Zusammenhang mit der technischen Nutzung dieser Website verarbeiteten Daten ist weder gesetzlich noch vertraglich vorgeschrieben. Ohne die Verarbeitung bestimmter technischer Daten, insbesondere der IP-Adresse, Session-Daten und der für die Bereitstellung der Website erforderlichen Verbindungsdaten, ist die Nutzung der Website jedoch technisch nicht möglich.</p><p>Eine automatisierte Entscheidungsfindung einschließlich Profiling im Sinne von Art. 22 DSGVO findet <strong>nicht</strong> statt.</p><blockquote class="plain"><p><span class="mark"><strong>Hinweis:</strong> Dies gilt nur für die Standardinstallation von OpenCulturas. Wenn ihr zusätzliche Module installiert, die Profiling, personalisierte Empfehlungen oder eine automatisierte Bewertung von Nutzer:innen durchführen, muss dieser Absatz überarbeitet oder entfernt werden.</span></p></blockquote><p>Es besteht <span class="mark">[keine gesetzliche Verpflichtung zur Bestellung eines Datenschutzbeauftragten]</span>.</p><blockquote class="plain"><p><span class="mark"><strong>Hinweis:</strong> Übernehmt diese Aussage nicht ungeprüft. Ob ein:e Datenschutzbeauftragte:r zu bestellen ist, hängt von eurer eigenen Organisation ab — z. B. von der Anzahl der Personen, die regelmäßig mit der automatisierten Verarbeitung personenbezogener Daten befasst sind, oder davon, ob die Verarbeitung eine Kerntätigkeit darstellt (siehe Art. 37 DSGVO und § 38 BDSG). Prüft dies im Einzelfall und holt im Zweifel rechtlichen Rat ein.</span></p></blockquote>'
