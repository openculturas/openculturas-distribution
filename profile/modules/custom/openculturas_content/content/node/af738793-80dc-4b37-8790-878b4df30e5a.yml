      value: '<blockquote class="plain"><p><span class="mark">Feel free to use excerpts from the following text as a foundation for your own privacy policy. However, please be aware that it is entirely the responsibility of the site owner to ensure that this page is accurate, complete, and up to date for their specific instance. This is especially important if additional modules are installed that process personal data or share it with third parties — such modules may introduce data processing activities that are not covered by this template and must be documented separately. This, of course, is no legal advice ;-)</span></p></blockquote><hr><p>The controller within the meaning of the General Data Protection Regulation (GDPR) is:</p><p><span class="mark">[Name of controller / company]</span><br><span class="mark">[Full postal address]&nbsp;</span><br><span class="mark">Email: [contact email address for privacy inquiries]</span></p><p>We process personal data only to the extent necessary to provide this website, and to ensure its stability, security, and audience measurement.</p><p>When you access this website, technically necessary data is processed by the web server or hosting provider in server log files. In particular, this may include your IP address, the date and time of access, the page or file requested, the referrer URL, browser type and browser version, as well as the operating system used. This processing is carried out in order to provide the website and to ensure the stability, security, and integrity of our information technology systems.</p><p>The legal basis for this processing is Article 6(1)(f) GDPR. Our legitimate interest lies in the technically secure, stable, and abuse-free operation of the website.</p><h2>Cookies</h2><p>Log files are deleted after <span class="mark">[XX days]</span> unless statutory retention obligations require otherwise or longer storage is necessary in individual cases to investigate specific security incidents.</p><blockquote class="plain"><p><span class="mark">Note: The exact retention period, and whether the IP address is stored in full or truncated form, depends on your hosting provider''s default configuration or your own server settings. Confirm this with your hosting provider (or your own admin/DevOps team if self-hosted) before publishing.</span></p></blockquote><p>This website uses only a technically necessary session cookie. A session ID is stored in this cookie in order to provide and maintain your session. The processing of personal data in connection with the session cookie is based on Article 6(1)(f) GDPR. To the extent that Section 25 of the German Telecommunications Digital Services Data Protection Act (TDDDG) applies to the storage of, or access to, information on your end device, this is done solely within the scope of the statutory exception for strictly necessary operations. The session cookie is automatically deleted at the end of the session.</p><h3>External Video Platforms</h3><p>This website allows the embedding of external videos from YouTube and Vimeo. These videos are not loaded automatically; content is only retrieved from the respective provider once you have given your explicit consent via our consent management tool ("cookie banner").</p><p>If you consent, YouTube (operated by Google Ireland Limited, or its parent company Google LLC) or Vimeo (operated by Vimeo.com, Inc.) will load content directly into your browser and may process personal data such as your IP address, browser and device information, and information about your viewing behaviour, potentially also for their own purposes. As both providers are based outside the EU/EEA, this may involve a transfer of personal data to the United States.</p><p>The legal basis for this processing is your consent pursuant to Article 6(1)(a) GDPR. You can withdraw your consent at any time with effect for the future via the link <a href="#editCookieSettings">Edit cookie settings</a> (also globally placed in the site footer).</p><p>For more information on the respective providers'' own data processing, please refer to their privacy policies:</p><ul><li data-list-item-id="e85e58f700a2a5bcd4ad912fa1f342cfc">YouTube/Google: <span class="mark">[current link to Google''s privacy policy]</span></li><li data-list-item-id="e22afd20d3016e5faae391ef0b22ffa46">Vimeo: <span class="mark">[current link to Vimeo''s privacy policy]</span></li></ul><blockquote class="plain"><p><span class="mark">Note: This section only applies if video embedding is actually enabled on your instance and your consent management tool is configured to gate YouTube/Vimeo content behind an explicit opt-in. Insert the actual name and, if helpful, a direct link to your consent management tool. If you use an alternative consent management platform, check whether it names YouTube and Vimeo as separate "services" or bundles them under a general "video" category — adjust the wording above accordingly. If only one of the two platforms (YouTube or Vimeo) is actually enabled, remove the references to the other.</span></p></blockquote><h2>Analytics</h2><p><span class="mark">In case you are integrating an analytics/tracking service, add an appropriate statement here — otherwise delete this part.</span></p><h2>Disclosure of personal data to third parties</h2><p>Recipients of personal data may include technical service providers engaged for the operation, provision, and maintenance of this website and the web analytics used, in particular hosting and IT service providers. Where such service providers act on our behalf, this is done within the framework of data processing agreements pursuant to Article 28 GDPR.</p><p><span class="mark"><strong>Note:</strong> Depending on your jurisdiction or internal policy, you may be required (or may simply want, for transparency) to name your actual hosting/IT service providers here. Check with whoever manages your hosting contracts.&nbsp;</span></p><p>Personal data is <span class="mark">[not transferred to recipients in countries outside the European Union (EU) or the European Economic Area (EEA)]</span>.</p><blockquote class="plain"><p><span class="mark"><strong>Note:</strong> The statements in this part are only accurate if all your infrastructure — hosting, analytics service, backups, CDN, email delivery, etc. — is genuinely located in the EU/EEA, and no additional module sends data to non-EU services (e.g. US-based APIs, fonts, maps, or embeds). Verify this with your hosting provider and review any additionally installed modules. If a third-country transfer does occur, this paragraph must be replaced with details of the transfer mechanism used (e.g. adequacy decision, Standard Contractual Clauses).</span></p><p><span class="mark">&nbsp;By default, OpenCulturas uses fonts bundled with the platform, served from your own web server, so no third-party font requests are made. Map tiles are delivered by OpenStreetMap. According to OpenStreetMap''s own statements, no tracking takes place when tiles are loaded; if you''d like to be fully independent of any third-party request, you can also self-host the map tiles.</span></p></blockquote><p>Personal data is stored only for as long as necessary to achieve the respective processing purposes or as required by statutory retention obligations. Server log files are generally deleted after <span class="mark">[XX days]</span>. Data processed as part of audience measurement is aggregated after <span class="mark">[XX days]</span> and thereafter stored only in a form that no longer permits any personal reference, unless statutory retention obligations require otherwise.</p><h2>Personal data on this platform</h2><p>The information on this website can be accessed without the collection of personal data. There is <strong>no requirement to register</strong> a user account.</p><blockquote class="plain"><p><span class="mark">The following applies unless you change the </span><a href="/admin/config/people/accounts"><span class="mark">registration and cancellation settings</span></a><span class="mark">.</span></p></blockquote><h3>User account</h3><p>If a user account is created, we store the following data:</p><ul><li data-list-item-id="e6f733ed11b9d55190945f3733a017019">Email address (technically required)</li><li data-list-item-id="e76832c620cf2fa4b3277ae3cb53f6192">Username (technically required)</li><li data-list-item-id="ee6021ec6eec2c8e87875e03c719d6fd4">Password hash (i.e. not stored in plain text)</li><li data-list-item-id="e30b1f3818795f5fffa6de132ffbeb731">Display name (optional, but recommended, as it replaces the username in public-facing contexts)</li><li data-list-item-id="ebd81521c605837ae561a84c3ab5c0adb">Preferred language (optional)</li><li data-list-item-id="e48b4adaba61d42063febc2dee3965c15">Time zone (optional)</li></ul><p>This data is used to enable login and to provide role-dependent access to additional information/functions.</p><p>Certain information about a user account''s activity is stored for a limited period for technical reasons. This includes, for example:</p><ul><li data-list-item-id="ef6b9a8bb465f4c1cf9c6de8b8b49ab70">Timestamps of successful or failed login attempts, as well as logout from the system</li><li data-list-item-id="e4494c0d5fbddef888d5e6764cba787b2">System error messages that occurred during a user''s interaction with the system (e.g. missing images or content pages)</li></ul><p>User accounts can be deleted by the users themselves. Content created with this user account remains in place if it has not previously been deleted, or marked "for deletion," by the user.</p><h3>Profiles</h3><p>Users may (optionally) create one or more profiles and edit them. Depending on the role within the system, this content goes through an approval process before publication.</p><p>Profiles allow personal data to be entered and thereby made available for publication, although there is no obligation to do so:</p><ul><li data-list-item-id="e37c233b3b0f0bf861c54ab5769734ca1">Address</li><li data-list-item-id="e2be285cae01212ca04ef117a87384d96">Contact details (e.g. phone number, email address, social media accounts)</li><li data-list-item-id="eb9d36af06599d76458c6164b606d37c6">Any information included in the profile text (which may also include information on origin, religion, or health)</li></ul><p><span class="mark">[Operator name]</span> has no influence on the provision of such information, particularly since it can be changed by the user accounts responsible for the respective profile.</p><h3>Reporting misuse</h3><p>There is an option to report information that has been published in a misleading or abusive way ("report abuse"), so that the publication can be withdrawn promptly. This is relevant, for example, if a profile contains personal information published on behalf of a person who has not given their consent to it. We will withdraw the publication of such disputed content until the matter has been clarified.</p><h2>Data subject rights</h2><p>Under the GDPR, you are entitled in particular to the right of access, rectification, erasure, restriction of processing, data portability, objection, and withdrawal of any consent given with effect for the future. You also have the right to lodge a complaint with a data protection supervisory authority. To exercise your rights, simply send an email to: <span class="mark">[contact email address]</span></p><p>Where we process personal data on the basis of Article 6(1)(f) GDPR, you have the right to object to the processing at any time on grounds relating to your particular situation.</p><p>The competent supervisory authority is:</p><p><span class="mark">[Name of the competent data protection supervisory authority]</span><br><span class="mark">[complete postal address]&nbsp;</span><br><span class="mark">Tel.: [phone number]&nbsp;</span><br><span class="mark">Email: [email address]</span></p><blockquote class="plain"><p><span class="mark"><strong>Note:</strong> Which authority is competent depends on the controller''s registered seat (for private companies/individuals) or the responsible public body (for public-sector operators). Look up the responsible authority for your federal state — a list of German supervisory authorities is available via the Conference of Independent Data Protection Supervisory Authorities of the Federal Government and the Federal States (DSK).</span></p></blockquote><p>The provision of data processed in connection with the technical use of this website is neither legally nor contractually required. However, without the processing of certain technical data, in particular the IP address, session data, and connection data required to provide the website, use of the website is technically not possible.</p><p>Automated decision-making, including profiling within the meaning of Article 22 GDPR, does not take place.</p><blockquote class="plain"><p><span class="mark"><strong>Note:</strong> This is only accurate for the baseline OpenCulturas setup. If you install additional modules that perform profiling, personalized recommendations, or automated scoring of users, this paragraph must be revised or removed.</span></p></blockquote><p>There is <span class="mark">[no legal obligation to appoint a data protection officer]</span>.</p><blockquote class="plain"><p><span class="mark"><strong>Note:</strong> Do not simply copy this statement. Whether a DPO must be appointed depends on your own organization — e.g. the number of people regularly involved in automated personal data processing, or whether processing is a core business activity (see Art. 37 GDPR and § 38 BDSG). Assess this individually, and consult legal advice if unsure.</span></p></blockquote>'
      format: full_html
      summary: 'The controller within the meaning of the General Data Protection Regulation (GDPR), information about personal data processing etc.'
