  body:
    -
      value: '<p>This website uses the free, open-source software OpenCulturas. It was developed by cultural institutions and cultural professionals in order to create the widest possible range of cultural platforms.</p><h2>Who is behind OpenCulturas?</h2><p>The driving organisations that contributed significantly to the conception, financing and implementation are</p><p>The <a href="https://landschaftsverband.org/">Landschaftsverband Südniedersachsen</a>, which was the first to publish a cultural platform for southern Lower Saxony with version 1.0: <a href="https://kulturis.online">kulturis</a>. The development was funded as a model project as part of the <a href="https://www.region-gestalten.bund.de/Region/DE/vorhaben/heimat20/uebersicht/modellvorhaben-kulturis.html">Heimat 2.0 Programm von Region Gestalten</a>.</p><ul><li data-list-item-id="e2c8f811c481bdbf7fa4c089f20f281e4"><a href="https://www.cowain.de">CoWAIN – Company Without An Interersting Name</a> as a developing agency with a significant share of in-house work; the open source world knows it as <em><span lang="en" dir="ltr">Contributions</span></em></li><li data-list-item-id="e890b3ea4389c3e833037d38c51b57f85">The <a href="https://www.lanze-lsa.de">Landeszentrum für Freies Theater Sachsen-Anhalt (LanZe)</a>, has published a state platform for independent theatre: <a href="https://www.theatris-lsa.de/de">THEATRIS</a>, funded by <a href="https://www.sachsen-anhalt.de/">the state of Saxony-Anhalt</a>, the <a href="https://www.bundesregierung.de/breg-de/bundesregierung/bundeskanzleramt/staatsministerin-fuer-kultur-und-medien">Federal Government Commissioner for Culture and the Media</a>, <a href="https://www.bundesregierung.de/breg-de/bundesregierung/bundeskanzleramt/staatsministerin-fuer-kultur-und-medien/neustart-kultur-startet-1767056">Neustart Kultur</a>, <a href="https://www.kulturstiftung.de/">Kulturstiftung der Länder</a> and <a href="https://www.kulturgemeinschaften.de/">Kultur.Gemeinschaften</a></li><li data-list-item-id="e41b944cff44f72f39dde585174200a51"><a href="https://www.cms-garden.org">CMS Garden</a>, a non-profit organisation for community outreach of the most active <span lang="en" dir="ltr">Open-Source-Content-Management-Communities</span></li></ul><h2>What is OpenCulturas all about?</h2><p>The basis is Drupal, an established free open source software that is perfect for creating your own data structures. Structured data is in turn important for the exchange of dates between different platforms, for example. OpenCulturas was created using existing standards for such exchange formats.</p><p>The open source licence explicitly permits the free and unrestricted use, investigation and further development of the software. Further developments should in turn be published under the same licence, preferably on the platform on which the official further development is based.</p><ul><li data-list-item-id="eb35dea4fbebffd4d4e78cb781d5e21a6">For those interested: <a href="https://www.openculturas.org">the official website for the software</a></li><li data-list-item-id="ec5bfd9f7687530075dfeac77323705fc">For developers: The <a href="https://www.drupal.org/project/openculturas">OpenCulturas project page</a> on Drupal.org, alternatively on <a href="https://github.com/openculturas">GitHub</a></li></ul><h2>Together we can achieve more</h2><p>We know what it''s like: the cultural sector is always tight. We believe that it makes sense to join forces and develop our software together, based on the feedback and wishes of our users. It makes much more sense than having lots of people develop the same thing with funding that is acquired again and again. That''s why we regularly exchange ideas in joint online meetings and also invite other cultural institutions to join us.</p><p><a href="https://www.openculturas.org">Find out more at openculturas.org</a></p>'
      format: full_html
      summary: 'This website uses the free, open-source software OpenCulturas. It was developed by cultural institutions and cultural professionals in order to create the widest possible range of cultural platforms.'
