    body:
      -
        value: '<p>Dieses Webangebot setzt die freie quelloffene Software OpenCulturas ein. Sie wurde von Kultureinrichtungen und Kulturschaffenden entwickelt, um ein möglichst breites Spektrum an Kulturplattformen damit erstellen zu können.</p><h2>Wer steckt hinter OpenCulturas?</h2><p>Die treibenden Organisationen, die maßgeblich zur Konzeption, Finanzierung und Umsetzung beigetragen haben, sind</p><ul><li data-list-item-id="e92f2cd6c8bb31574d23b1b0472392828">Der <a href="https://landschaftsverband.org/">Landschaftsverband Südniedersachsen</a>, der mit Version 1.0 als erster eine Kulturplattform für Südniedersachsen veröffentlich hat: <a href="https://kulturis.online">kulturis</a>. Gefördert wurde die Entwicklung als Modellprojekt im Rahmen des <a href="https://www.region-gestalten.bund.de/Region/DE/vorhaben/heimat20/uebersicht/modellvorhaben-kulturis.html">Programms Heimat 2.0 von Region Gestalten</a>.</li><li data-list-item-id="e9f56327e2263269bb40a2c79c37dbe44"><a href="https://www.cowain.de">CoWAIN – Company Without An Interersting Name</a> als entwickelnde Agentur mit einem nennenswerten Anteil an Eigenleistung; die Open-Source-Welt kennt es als <em><span lang="en" dir="ltr">Contributions</span></em></li><li data-list-item-id="efcdce1a65655510c357f890bf76ea04a"><a href="https://www.lanze-lsa.de">Das Landeszentrum für Freies Theater Sachsen-Anhalt (LanZe)</a>, das eine Landesplattform für Freies Theater veröffentlicht hat: <a href="https://www.theatris-lsa.de/de">THEATRIS</a>. Gefördert wurde Theatris vom <a href="https://www.sachsen-anhalt.de/">Land Sachsen-Anhalt</a>, der <a href="https://www.bundesregierung.de/breg-de/bundesregierung/bundeskanzleramt/staatsministerin-fuer-kultur-und-medien">Beauftragten der Bundesregierung für Kultur und Medien</a>, <a href="https://www.bundesregierung.de/breg-de/bundesregierung/bundeskanzleramt/staatsministerin-fuer-kultur-und-medien/neustart-kultur-startet-1767056">Neustart Kultur</a>, <a href="https://www.kulturstiftung.de/">Kulturstiftung der Länder</a> und <a href="https://www.kulturgemeinschaften.de/">Kultur.Gemeinschaften</a>.</li><li data-list-item-id="e36dc8e04c0319a29cf3fc77eb4c40261"><a href="https://www.cms-garden.org">CMS Garden</a>, ein gemeinnützer Verein für gemeinschaftliche Öffentlichkeitsarbeit der aktivsten <span lang="en" dir="ltr">Open-Source-Content-Management-Communities</span></li></ul><h2>Was steckt in OpenCulturas?</h2><p>Die Basis bildet Drupal, eine etablierte freie Open-Source-Software, die sich perfekt eignet für die Erstellung eigener Datenstrukturen. Strukturierte Daten sind wiederum wichtig für den Austausch von beispielsweise Terminen zwischen unterschiedlichen Plattformen. OpenCulturas wurde entlang bestehender Standards für solche Austauschformate erstellt.</p><p>Die Open-Source-Lizenz erlaubt explizit die freie und kostenlose Verwendung, Untersuchung und Weiterentwicklung der Software. Weiterentwicklungen sollen wiederum unter derselben Lizenz veröffentlicht werden, vorzugsweise auf derjenigen Plattform, auf der die offizielle Weiterentwicklung beheimatet ist.</p><ul><li data-list-item-id="e293a65b7a84f359094e6fb85128fdbd6">Für Interessierte: <a href="https://www.openculturas.org">die offizielle Website zur Software</a></li><li data-list-item-id="e787f8227ae1117fdf9f7e03ab83b28dd">Für Entwickler*innen: Die <a href="https://www.drupal.org/project/openculturas">OpenCulturas-Projektseite</a> auf Drupal.org, alternativ auf <a href="https://github.com/openculturas">GitHub</a></li></ul><h2>Gemeinsam erreichen wir mehr</h2><p>Wir kennen das: Der Kultursektor ist immer klamm. Wir glauben daran, dass es sinnvoll ist, uns zusammenzutun und unsere Software gemeinschaftlich weiterentwickeln zu lassen, und zwar entlang der Rückmeldungen und Wünsche unserer Nutzenden. Viel sinnvoller als wenn viele dasselbe mit immer wieder neu akquirierten Fördermitteln entwickeln lassen. Deshalb tauschen wir uns regelmäßig in gemeinsamen Online-Treffen aus und laden auch andere Kultureinrichtungen dazu ein.</p><p><a href="https://www.openculturas.org">Mehr erfahren auf openculturas.org</a></p>'
        format: advanced_html
        summary: 'Dieses Webangebot setzt die freie quelloffene Software OpenCulturas ein. Sie wurde von Kultureinrichtungen und Kulturschaffenden entwickelt, um ein möglichst breites Spektrum an Kulturplattformen damit erstellen zu können.'
