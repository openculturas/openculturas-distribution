    path:
      -
        alias: /community/openculturas-verein
        langcode: de
        pathauto: 1
    content_translation_source:
      -
        value: en
    content_translation_outdated:
      -
        value: false
    body:
      -
        value: "<p>Wir organisieren und koordinieren die Pflege und Weiterentwicklung der Software OpenCulturas und machen Öffentlichkeitsarbeit für diese Lösung im Speziellen und Open-Source-Software im Kulturleben im Allgemeinen. \r\n\r\n</p><p>Wir beraten und unterstützen Organisationen, die OpenCulturas als Plattform einsetzen wollen. \r\n\r\n</p><p>Gern nehmen wir hierfür Fördergelder entgegen und stehen auch gern zur Verfügung, um kooperativ eingeworbene Budgets zu verwalten, wenn mehrere Interessierte gemeinsam mit ihren finanziellen Mitteln mehr erreichen wollen als alleine möglich wäre.\r\n</p>"
        format: basic_html
        summary: ''
    field_subtitle:
      -
        value: 'Der eingetragene gemeinnützige Verein zur Software'
        format: minimal_html
