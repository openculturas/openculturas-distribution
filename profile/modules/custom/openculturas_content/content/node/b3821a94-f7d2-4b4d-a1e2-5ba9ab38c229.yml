  body:
    -
      value: '<p>We organize and coordinate the maintenance and further development of the OpenCulturas software and promote this solution in particular and open source software in cultural life in general.</p><p>We advise and support organizations that want to use OpenCulturas as a platform.</p><p>We are happy to accept funding for this purpose and are also available to manage cooperatively raised budgets if several interested parties want to achieve more together with their financial resources than would be possible alone.</p>'
