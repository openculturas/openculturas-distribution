    body:
      -
        value: '<p>Vorführung von OpenCulturas: Wie alles miteinander vernetzt ist, wie man Inhalte einpflegt. Live-Demo auf unserem Demo-System. Wir laden herzlich dazu ein, Fragen zu stellen und beantworten diese direkt mit Beispielen. Und wir sagen natürlich auch ganz offen, was nicht geht - oder noch nicht geht.</p><p>Die Veranstaltung findet als Videokonferenz über BigBlueButton statt. Keine Softwareinstallation, einfach im Browser starten. Eine kurze Handreichung kommt mit der Terminbestätigung. Wir hosten BigBlueButton in Deutschland und haben es datenschutzsensibel konfiguriert. Dazu gehört, dass wir Aufzeichnungen unterbinden. Wir sind also unter uns.</p><p>Das Duzen wird in diesen Veranstaltungen bevorzugt. Es gibt aber die Möglichkeit zum "Opt-out", wir fragen das ab.</p><p>Je nachdem, welche Interessenlage sich aus den Anmeldungen ergibt, sind auch Gespräche über Kooperationsmöglichkeiten oder der Austausch über Förderprogramme möglich. Unser ehrgeiziges Ziel: euch Interessierte zu einer Community zu machen, denn ihr habt gemeinsame Interessen, die sich möglicherweise schlagkräftiger gemeinsam verfolgen lassen.</p>'
        format: basic_html
        summary: ''
