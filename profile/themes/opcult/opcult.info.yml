name: 'OpenCulturas Next'
type: theme
core_version_requirement: '^10 || ^11'
description: 'OpenCulturas modernized base theme. Are you switching from <em>Openculturas Base</em> theme? Please check the theme settings here!'
package: OpenCulturas
version: 3.0.x-dev
project: openculturas
'base theme': stable9

ckeditor5-stylesheets:
  - css/ckeditor.css

libraries:
  - opcult/global

libraries-override:
  # Prevent social_media_links from loading fontawesome via CDN. We use local svg sprite anyway.
  social_media_links/fontawesome.component: false
  # Removed to set a border in our CSS.
  flag/flag.link:
    css:
      theme:
        css/flag-link.css: false
  views_data_export/views_data_export:
    css:
      theme:
        css/views_data_export.css: false
regions:
  page_top: 'Above everything'
  branding: Branding
  utilities_links: Utilities
  offcanvas_menu: 'Offcanvas menu'
  highlights_menu: 'Highlights menu'
  breadcrumbs: Breadcrumbs
  editorial: 'Editorial tools/info'
  header_intro: 'Header intro'
  page_title: 'Page title'
  content: 'Main content'
  footer: Footer
  below_footer: 'Below footer'
  page_bottom: 'Below everything'

dependencies:
  - 'blockgroup:blockgroup'
  - 'core:stable9'
  - 'layout_builder_component_attributes:layout_builder_component_attributes'
  - 'layout_options:layout_options'

config_devel:
  install:
    - opcult.settings
  optional:
    - asset_injector.css.opcult_overrides
    - blockgroup.block_group_content.facets_group
    - core.entity_view_mode.node.full_lb
    - core.entity_view_mode.taxonomy_term.full_lb
