layout_oc1col_section:
  label: 'OC 1 column'
  template: templates/layouts/layout--oc1col-section
  class: '\Drupal\layout_options\Plugin\Layout\LayoutOptions'
  category: 'OpenCulturas'
  default_region: first
  icon_map:
    - [first]
  regions:
    first:
      label: First

layout_oc2col_section:
  label: 'OC 2 column'
  template: templates/layouts/layout--oc2col-section
  class: '\Drupal\layout_options\Plugin\Layout\LayoutOptions'
  category: 'OpenCulturas'
  default_region: first
  icon_map:
    - [first, second]
  regions:
    first:
      label: First
    second:
      label: Second

layout_oc3col_section:
  label: 'OC 3 column'
  template: templates/layouts/layout--oc3col-section
  class: '\Drupal\layout_options\Plugin\Layout\LayoutOptions'
  category: 'OpenCulturas'
  default_region: first
  icon_map:
    - [first, second, third]
  regions:
    first:
      label: First
    second:
      label: Second
    third:
      label: Third

layout_oc5col_section:
  label: 'OC 5 sections'
  template: templates/layouts/layout--oc5col-section
  class: '\Drupal\layout_options\Plugin\Layout\LayoutOptions'
  category: 'OpenCulturas'
  default_region: first
  icon_map:
    - [first, first, second, second]
    - [third, third, second, second]
    - [fourth, fourth, fourth, fifth]
    - [fourth, fourth, fourth, fifth]
  regions:
    first:
      label: Title
    second:
      label: Mood
    third:
      label: Essentials
    fourth:
      label: Content
    fifth:
      label: Aside
