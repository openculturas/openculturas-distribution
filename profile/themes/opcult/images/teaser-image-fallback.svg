<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1220 750">
  <defs>
    <style>
      .polygon-group {
        isolation: isolate;
      }

      polygon {
        stroke-width: 0px;
      }

      .cls-1 {
        fill: #000;
        opacity: 0.1;
      }

      .cls-4, .cls-5 {
