        <polygon id="uppercenter" class="cls-4" points="1120.8 739.6 99.2 739.6 610 11.4 1120.8 739.6"/>
        <polygon id="lowerleft" class="cls-1" points="1120.8 739.6 99.2 739.6 42.9 280.8 1120.8 739.6"/>
