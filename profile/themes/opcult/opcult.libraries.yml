# Main theme library.
# We use and deliver css maps, therefore we disable preprocess for css files.
global:
  js:
    js/opcult.js: {}
  css:
    theme:
      css/opcult.css: { preprocess: false }
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
    - core/drupal.dialog
    - opcult/font.montserrat

theme.settings:
  css:
    component:
      css/theme.settings.css: { preprocess: false }

font.montserrat:
  css:
    theme:
      css/fonts.css: { preprocess: false }
