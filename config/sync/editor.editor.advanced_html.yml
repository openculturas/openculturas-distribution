uuid: e7c8848a-46fb-46df-b606-d88a6a970577
langcode: en
status: true
dependencies:
  config:
    - filter.format.advanced_html
  module:
    - ckeditor5
format: advanced_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - style
      - bold
      - italic
      - strikethrough
      - link
      - bulletedList
      - numberedList
      - textPartLanguage
      - drupalMedia
      - blockQuote
      - specialCharacters
      - undo
      - redo
      - removeFormat
      - superscript
      - subscript
      - sourceEditing
  plugins:
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_language:
      language_list: all
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<a id name lang dir hreflang>'
        - '<div lang dir id class>'
        - '<p lang dir>'
        - '<blockquote cite lang dir>'
        - '<q cite lang dir>'
        - '<ul lang dir>'
        - '<ol lang dir>'
        - '<dl lang dir class>'
        - '<dt lang dir>'
        - '<dd lang dir class>'
        - '<h2 lang dir id>'
        - '<h3 lang dir id>'
        - '<h4 lang dir id>'
        - '<h5 lang dir id>'
    ckeditor5_style:
      styles:
        -
          label: Inset
          element: '<div class="inset">'
        -
          label: 'Bold (faux)'
          element: '<span class="bold">'
        -
          label: 'Italic (faux)'
          element: '<span class="italic">'
    linkit_extension:
      linkit_enabled: true
      linkit_profile: openculturas
    media_media:
      allow_view_mode_override: true
image_upload:
  status: false
